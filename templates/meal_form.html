{% extends "base.html" %}
{% block title %}Nuovo pasto - Kitchen Planner{% endblock %}
{% block content %}
<section class="form-shell"><div class="form-heading"><p class="eyebrow">Agenda</p><h2>Nuovo pasto</h2></div>
<form class="form-panel" method="post">
  <label>Nome personalizzato<input name="name" value="{{ meal.name }}" placeholder="Es. Cena di famiglia" required></label>
  <div class="field-grid"><label>Data<input name="meal_date" type="date" value="{{ meal.meal_date }}" required></label><label>Persone<input name="people_count" type="number" min="1" value="{{ meal.people_count or 2 }}" required></label></div>
  <label>Momento<select name="meal_type">{% for key,label in {'colazione':'Colazione','pranzo':'Pranzo','cena':'Cena'}.items() %}<option value="{{ key }}" {% if meal.meal_type == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
  <fieldset><legend>Piatti</legend>{% if recipes %}<div class="recipe-select-grid">{% for recipe in recipes %}<label class="recipe-select"><input type="checkbox" name="recipe_ids" value="{{ recipe.id }}" {% if recipe.id in meal.recipe_ids %}checked{% endif %}><span>{% if recipe.picture %}<img src="{{ recipe.picture }}" alt="">{% endif %}<strong>{{ recipe.name }}</strong><small>{{ recipe.servings }} persone</small></span></label>{% endfor %}</div>{% else %}<p class="field-help">Crea prima una ricetta dal <a href="{{ url_for('recipes') }}">ricettario</a>.</p>{% endif %}</fieldset>
  <div class="form-actions"><a class="button secondary" href="{{ url_for('meals_agenda') }}">Annulla</a><button class="button" type="submit">Salva pasto</button></div>
</form></section>
{% endblock %}
